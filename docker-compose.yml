version: '3.8'

services:
  inverkids-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: inverkids-mcp
    restart: unless-stopped
    
    environment:
      - BACKEND_BASE_URL=${BACKEND_BASE_URL}
      - HTTP_TIMEOUT=${HTTP_TIMEOUT:-30}
      - MAX_RETRIES=${MAX_RETRIES:-3}
      - AUTH_TIMEOUT=${AUTH_TIMEOUT:-10}
      - MCP_NAME=${MCP_NAME:-inverkids-mcp}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    
    env_file:
      - .env
    
    ports:
      - "8000:8000"
    
    volumes:
      - ./logs:/app/logs
    
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    
    networks:
      - inverkids-network

networks:
  inverkids-network:
    driver: bridge